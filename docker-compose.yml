services:
  mailbox:
    build:
      context: ../backend
      dockerfile: cmd/mailbox/Dockerfile
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - mailbox-data:/data
    environment:
      - MAILBOX_DATA_DIR=/data
      - MAILBOX_ADDR=:8443
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  mailbox-data:
