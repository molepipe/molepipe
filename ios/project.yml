name: Molepipe
options:
  bundleIdPrefix: org.molepipe
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: Molepipe/Info.plist
    CODE_SIGN_ENTITLEMENTS: Molepipe/Molepipe.entitlements
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_BITCODE: NO
    CLANG_ENABLE_MODULES: YES
    DEVELOPMENT_TEAM: ""

targets:
  Molepipe:
    type: application
    platform: iOS
    sources:
      - path: Molepipe
        excludes:
          - "**/*.xcassets"
    resources:
      - path: Molepipe/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.molepipe.molepipe
        PRODUCT_NAME: Molepipe
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/Frameworks"
        # torhost (Rust/Arti) static library. gomobile leaves the torhost_*
        # symbols undefined in the static Mobile.xcframework; they are resolved
        # here at app-link time. iOS device and simulator are BOTH ios/arm64, so
        # the correct slice is selected by SDK below — cgo build tags cannot tell
        # them apart, which is why the linking lives here and not in Go.
        OTHER_LDFLAGS:
          - "-ltorhost"
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]":
          - "$(SRCROOT)/../backend/internal/tor/artihost/lib/ios-arm64"
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]":
          - "$(SRCROOT)/../backend/internal/tor/artihost/lib/iossim-arm64"
    dependencies:
      # gomobile emits a STATIC xcframework, so it is linked, not embedded. If a
      # gomobile version emits a dynamic framework instead, set embed: true (see
      # HANDOFF.md → Troubleshooting).
      - framework: Mobile.xcframework
        embed: false
        link: true
